<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点亮信号灯</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101b26; color: #eef5fa; font-family: system-ui, sans-serif; }
    main { width: min(90%, 440px); padding: 40px 24px; text-align: center; border: 1px solid #344656; border-radius: 24px; background: #182937; }
    .tag { color: #a5becf; font-size: 13px; letter-spacing: 3px; }
    h1 { margin: 18px 0 30px; font-size: 32px; }
    .lamp { width: 88px; height: 88px; margin: auto; border-radius: 50%; background: #435361; border: 6px solid #253b4c; }
    .lamp.on { background: #73efae; box-shadow: 0 0 45px #73efae66; }
    #status { margin: 24px 0; }
    button { border: 0; border-radius: 12px; padding: 14px 28px; background: #a9f5cf; color: #102d23; font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <p class="tag">SIGNAL-81C7-R2</p>
    <h1>点亮信号灯</h1>
    <div id="lamp" class="lamp" aria-hidden="true"></div>
    <p id="status" role="status" aria-live="polite">信号灯已熄灭</p>
    <button id="toggle" type="button" aria-pressed="false">点亮信号灯</button>
  </main>
  <script>
    const button = document.getElementById('toggle');
    const lamp = document.getElementById('lamp');
    const status = document.getElementById('status');
    button.addEventListener('click', () => {
      const on = button.getAttribute('aria-pressed') !== 'true';
      button.setAttribute('aria-pressed', String(on));
      lamp.classList.toggle('on', on);
      status.textContent = on ? '信号灯已点亮' : '信号灯已熄灭';
      button.textContent = on ? '熄灭信号灯' : '点亮信号灯';
    });
  </script>
</body>
</html>
